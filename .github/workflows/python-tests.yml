name: Python Web 教程检查
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r fastapi/examples/01-hello-world/requirements.txt ruff==0.11.13
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
